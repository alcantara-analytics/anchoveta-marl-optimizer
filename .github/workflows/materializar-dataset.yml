name: verificar-dataset-base

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/raw/MapProbabilidad_adulto.csv'
      - 'scripts/materializar_datos.py'
      - '.github/workflows/materializar-dataset.yml'

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar MapProbabilidad_adulto.csv
        run: python scripts/materializar_datos.py

      - name: Verificar número de filas
        run: |
          test "$(wc -l < data/raw/MapProbabilidad_adulto.csv)" -eq 25601
