name: compilar-tdr

on:
  push:
    paths:
      - 'data/raw/MapProbabilidad_adulto.csv'
      - 'src/**'
      - 'scripts/**'
      - 'docs/tdr/**'
      - 'docs/resultados_ampliados/**'
      - '.github/workflows/compilar-tdr.yml'
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline sobre MapProbabilidad_adulto.csv
        run: |
          python scripts/run_pipeline.py             --sernanp no             --precio-combustible 5.0             --costo-operativo-hora 0.0             --no-gif

      - name: Generar figuras y resultados del TDR
        run: python docs/tdr/generar_figuras.py

      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended

      - name: Compilar informe
        working-directory: docs/tdr
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Verificar PDF
        run: test -s docs/tdr/main.pdf

      - name: Publicar TDR y resultados
        uses: actions/upload-artifact@v4
        with:
          name: tdr-resuelto-map-probabilidad-adulto
          path: |
            docs/tdr/main.pdf
            docs/tdr/main.tex
            docs/tdr/sections/
            docs/tdr/figures/
            outputs/
            docs/resultados_ampliados/
          retention-days: 30
