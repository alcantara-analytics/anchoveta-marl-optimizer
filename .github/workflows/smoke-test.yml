name: validacion-dataset-real

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Materializar MapProbabilidad_adulto.csv
        run: python scripts/materializar_datos.py

      - name: Ejecutar tests sobre la grilla real
        run: pytest -q

      - name: Ejecutar pipeline completo con MapProbabilidad_adulto.csv
        run: |
          python scripts/run_pipeline.py             --sernanp no             --precio-combustible 5.0             --costo-operativo-hora 0.0

      - name: Validar auditoría
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("outputs/auditoria.json")
          x = json.loads(p.read_text(encoding="utf-8"))

          assert x["procedencia_probabilidad"] == "MAP_PROBABILIDAD_ADULTO"
          assert x["probabilidad_simulada"] is False
          assert x["rutas_y_movimiento_simulados"] is True
          assert x["n_agentes"] == 15

          print(json.dumps(x, indent=2, ensure_ascii=False))
          PY

      - name: Verificar resultados principales
        run: |
          test -f outputs/mapa_probabilidad_zonas.png
          test -f outputs/mapa_asignacion_greedy.png
          test -f outputs/mapa_asignacion_milp.png
          test -f outputs/simulacion_flota.gif
          test -f outputs/resumen_metodos.csv
          test -f outputs/costos_por_barco.csv
          test -f outputs/costos_por_puerto.csv
          test -f outputs/reporte_resultados.html

      - name: Publicar resultados de la grilla real como artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultados-map-probabilidad-adulto
          path: outputs/
          retention-days: 30
