name: validacion-dataset-base

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar MapProbabilidad_adulto.csv
        run: |
          test -f MapProbabilidad_adulto.csv
          head -n 2 MapProbabilidad_adulto.csv

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest -q

      - name: Ejecutar pipeline completo
        run: |
          python scripts/run_pipeline.py             --sernanp no             --precio-combustible 5.0             --costo-operativo-hora 0.0

      - name: Validar auditoría
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("outputs/auditoria.json").read_text(encoding="utf-8"))
          assert x["procedencia_probabilidad"] == "MAP_PROBABILIDAD_ADULTO"
          assert x["grilla_probabilidad_generada_por_pipeline"] is False
          assert x["interpolacion_probabilidad_usada"] is False
          assert x["marl_perturbacion_probabilidad"] is False
          assert x["n_filas_validas_probabilidad"] == 11752
          assert x["n_agentes"] == 15
          print(json.dumps(x, indent=2, ensure_ascii=False))
          PY

      - name: Verificar salidas
        run: |
          test -f outputs/mapa_probabilidad_zonas.png
          test -f outputs/mapa_asignacion_greedy.png
          test -f outputs/mapa_asignacion_milp.png
          test -f outputs/mapa_asignacion_marl.png
          test -f outputs/asignacion_greedy.csv
          test -f outputs/asignacion_milp.csv
          test -f outputs/asignacion_marl.csv
          test -f outputs/historial_entrenamiento_marl.csv
          test -f outputs/trayectorias_marl.csv
          test -f outputs/simulacion_flota_marl.gif
          test -f outputs/resumen_metodos.csv
          test -f outputs/resumen_puerto_metodo.csv
          test -f outputs/reporte_resultados.html

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-map-probabilidad-adulto
          path: outputs/
          retention-days: 30
